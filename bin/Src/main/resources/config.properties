# Flipkart Automation Test Configuration

# Browser settings
browser=chrome
headless=false
implicit.wait=10
explicit.wait=20

# Application URLs
base.url=https://www.flipkart.com/
search.url=https://www.flipkart.com/search

# Test data
search.product=laptop
test.email=your_email@test.com
test.password=your_password

# Element wait timeouts (in seconds)
short.wait=5
medium.wait=10
long.wait=30

# Screenshot settings
screenshot.on.failure=true
screenshot.path=screenshots/